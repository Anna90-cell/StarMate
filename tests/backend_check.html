<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StarMate 后端接口自测页（D 用，非 A 的正式前端）</title>
<style>
  body { font-family: sans-serif; margin: 24px; background: #faf7ff; color: #333; }
  button { margin: 4px; padding: 8px 14px; border: 0; border-radius: 8px;
           background: #7c6fe0; color: #fff; cursor: pointer; }
  pre { background: #fff; border: 1px solid #ddd; border-radius: 8px;
        padding: 12px; min-height: 60px; white-space: pre-wrap; word-break: break-all; }
  .row { margin-bottom: 10px; }
</style>
</head>
<body>
<h2>StarMate 后端接口自测页</h2>
<p>先启动 <code>python app.py</code>，再点按钮逐个验证；响应直接显示在下方。</p>

<div class="row">
  <button onclick="call('GET','/api/test')">GET /api/test</button>
  <button onclick="call('GET','/api/companion')">GET /api/companion</button>
  <button onclick="call('GET','/api/focus/history')">GET /api/focus/history</button>
  <button onclick="call('GET','/api/reward')">GET /api/reward</button>
</div>
<div class="row">
  <button onclick="call('POST','/api/companion/generate', {name:'小星', description:'温柔活泼的猫耳少女'})">生成伙伴</button>
  <button onclick="call('PUT','/api/companion', {name:'小橘', avatar_id:'orange_cat'})">更新伙伴</button>
  <button onclick="call('POST','/api/chat', {message:'我有点学不下去了', mode:'focus', task:'机器学习作业', mood:2})">AI 聊天</button>
</div>
<div class="row">
  <button onclick="createSession()">创建专注记录</button>
  <button onclick="call('POST','/api/mood', {session_id:window._sid, stage:'before', mood:2})">保存情绪</button>
  <button onclick="call('POST','/api/focus/diary', {session_id:window._sid})">生成日记</button>
  <button onclick="call('POST','/api/reward/claim', {session_id:window._sid})">领取奖励</button>
</div>

<h3>响应结果</h3>
<pre id="out">（等待操作）</pre>

<script>
const API_BASE = "http://127.0.0.1:5000";
async function call(method, path, body) {
  const options = { method, headers: { "Content-Type": "application/json" } };
  if (body) options.body = JSON.stringify(body);
  try {
    const resp = await fetch(API_BASE + path, options);
    const json = await resp.json();
    show(resp.status, json);
    return json;
  } catch (e) {
    document.getElementById("out").textContent = "请求失败：" + e.message;
  }
}
function show(status, json) {
  document.getElementById("out").textContent =
    "HTTP " + status + "\n" + JSON.stringify(json, null, 2);
}
async function createSession() {
  const json = await call("POST", "/api/focus/session", {
    task: "完成机器学习作业", planned_minutes: 25, actual_minutes: 25,
    completed: true, started_at: new Date().toISOString(),
    mood_before: 2, mood_after: 4
  });
  if (json && json.success) {
    window._sid = json.data.session_id;
    document.getElementById("out").textContent +=
      "\n\n已记住 session_id：" + window._sid + "，可继续点后面的按钮。";
  }
}
</script>
</body>
</html>
