<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarMate - 我的伙伴</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/companion.css">
</head>

<body>

<div class="app-container">

    <!-- 右侧主体区域 -->
    <main class="companion-main">

        <!-- 页面标题 -->
        <header class="page-header">
            <h1>我的伙伴</h1>
            <p>每一次相遇，都值得被珍藏。</p>
        </header>


        <!-- 伙伴房间 -->
        <section class="companion-room">

            <div class="room-title">
                <span>♡</span>
                <h2>伙伴房间</h2>
            </div>

            <!-- 有伙伴时显示 -->
            <div class="companion-display" id="companion-display">


            <div class="companion-character">

                <img
                    id="companion-image"
                    src="assets/characters/character-01.png"
                    alt="我的桌宠"
                >

            </div>


                <div class="companion-info">
                    <h2 id="companion-name">我的伙伴</h2>
                    <p>很高兴与你相遇！</p>
                </div>

            </div>

            <!-- 没有伙伴时显示 -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">♡</div>
                <h2>暂未创建伙伴</h2>
                <p>创建一位属于你的伙伴，开启新的故事吧。</p>

                <a href="create.html" class="create-link">
                    创建伙伴
                </a>
            </div>

        </section>

        
        <!-- 伙伴成长面板 -->
        <section id="growth-panel">
            <div class="growth-header">
                <h2>伙伴成长</h2>
                <span id="pet-level">Lv.1</span>
            </div>

            <div class="growth-exp">
                <span>经验值：</span>
                <span id="pet-exp">0</span>
                <span> / </span>
                <span id="pet-next">30</span>
                <span> EXP</span>
            </div>

            <progress id="pet-exp-bar" value="0" max="100"></progress>
        </section>


        <div class="companion-actions">
            <a href="focus.html" class="action-btn">进入专注空间</a>

            <a href="entertainment.html" class="action-btn">进入娱乐空间</a>

            <a href="index.html" class="action-btn">返回首页</a>
        </div>

    </main>

</div>


<script src="js/c-api.js"></script>
<script src="js/companion-store.js"></script>
<script src="js/growth.js"></script>
<script src="js/companion.js"></script>


</body>
</html>
