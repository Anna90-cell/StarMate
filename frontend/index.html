
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarMate - 首页</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <div class="app-container">

        <!-- 左侧导航栏 -->
        <aside class="sidebar">

            <div class="logo">
                <span>✦</span> StarMate
            </div>

            <div class="nav-list">
                <a href="index.html" class="nav-item active">
                    <span>⌂</span>
                    首页
                </a>

                <a href="create.html" class="nav-item">
                    <span>✧</span>
                    创建伙伴
                </a>

                <a href="companion.html" class="nav-item">
                    <span>♡</span>
                    我的伙伴
                </a>

                <a href="focus.html" class="nav-item">
                    <span>✎</span>
                    专注空间
                </a>

                <a href="entertainment.html" class="nav-item">
                    <span>✿</span>
                    娱乐空间
                </a>

            </div>

            <div class="sidebar-bottom">
                <div class="user-avatar">♡</div>
                <span>我的空间</span>
            </div>

        </aside>


        <!-- 右侧主展示区域 -->
        <main class="main-content">

            <!-- 背景装饰 -->
            <div class="star star-one">✦</div>
            <div class="star star-two">✧</div>
            <div class="star star-three">✦</div>

            <!-- 欢迎信息 -->
            <div class="welcome-text">
                <p>WELCOME TO STARMATE</p>
                <h1>今天也要开心呀！</h1>
                <span>你的专属伙伴，一直在这里陪伴你。</span>
            </div>

            <!-- 默认人物展示 -->
            <section class="character-area">

                <div class="character-placeholder">

                    <div class="character-halo"></div>

                <div class="character-figure">
                    <img
                        id="home-character-image"
                        src="assets/characters/character-01.png"
                        alt="我的伙伴"
                    >
                </div>

                </div>

                <div class="character-info">
                    <span>YOUR COMPANION</span>
                    <h2 id="home-character-name">等待相遇的伙伴</h2>
                    <p>开启一段属于你们的故事吧。</p>
                </div>

            </section>

            <!-- 底部提示 -->
            <div class="home-tip">
                ✦ 选择左侧功能，开启你的 StarMate 之旅 ✦
            </div>

        </main>

    </div>
<script type="module" src="js/index.js"></script>
</body>
</html>
