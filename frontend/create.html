<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarMate - 创建伙伴</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/create.css">
</head>

<body>

<div class="app-container">

    <!-- 右侧创建区域 -->
    <main class="create-main">

        <!-- 中间选择面板 -->
        <section class="selection-panel">

            <h1>创建你的伙伴</h1>
            <p class="subtitle">选择一位喜欢的伙伴，开启新的故事。</p>

            <!-- 三个分类标签 -->
            <div class="tab-list">

                <button class="tab-btn active" data-tab="character">
                    人物
                </button>

                <button class="tab-btn" data-tab="background">
                    背景
                </button>

                <button class="tab-btn" data-tab="setting">
                    设置
                </button>

            </div>



            <!-- 人物选择 -->
            <div class="tab-content active" id="character">

                <h3>选择人物</h3>

                <div class="option-grid">

                    <button class="option-card selected" data-character="1">
                        <img src="assets/characters/character-01.png" alt="角色一">
                        <span>伙伴一</span>
                    </button>

                    <button class="option-card" data-character="2">
                        <img src="assets/characters/character-02.png" alt="角色二">
                        <span>伙伴二</span>
                    </button>

                    <button class="option-card" data-character="3">
                        <img src="assets/characters/character-03.png" alt="角色三">
                        <span>伙伴三</span>
                    </button>

                    <button class="option-card" data-character="4">
                        <img src="assets/characters/character-04.png" alt="角色四">
                        <span>伙伴四</span>
                    </button>

                    <button class="option-card" data-character="5">
                        <img src="assets/characters/character-05.png" alt="角色五">
                        <span>伙伴五</span>
                    </button>

                </div>

            </div>



            <!-- 背景选择 -->
            <div class="tab-content" id="background">

                <h3>选择背景</h3>

                <div class="option-grid">

                    <button class="option-card selected"
                        data-background="1">
                        <div class="option-image">☁</div>
                        <span>背景一</span>
                    </button>

                    <button class="option-card"
                        data-background="2">
                        <div class="option-image">✿</div>
                        <span>背景二</span>
                    </button>

                    <button class="option-card"
                        data-background="3">
                        <div class="option-image">✦</div>
                        <span>背景三</span>
                    </button>

                </div>

            </div>


            <!-- 设置 -->
            <div class="tab-content" id="setting">

                <h3>伙伴设置</h3>

                <label for="character-name">伙伴名称</label>

                <input
                    type="text"
                    id="character-name"
                    placeholder="给你的伙伴取个名字"
                    maxlength="20"
                >

                <div class="description-input">
                    <label for="character-description">描述一下你想要的伙伴</label>
                    <textarea
                        id="character-description"
                        placeholder="例如：我希望我的伙伴温柔、活泼，喜欢鼓励我学习，也会在我难过时安慰我。"
                        rows="4"
                    ></textarea>
                </div>

            </div>


            <!-- 底部按钮 -->
            <div class="panel-footer">

                <button class="confirm-btn" id="confirm-btn">
                    确认创建
                </button>

            </div>

        </section>


        <!-- 右侧人物展示 -->
        <section class="preview-area">

            <div class="preview-glow"></div>

            <div class="preview-character">
                <img
                    id="preview-image"
                    src="assets/characters/character-01.png"
                    alt="桌宠角色"
                >
            </div>

            <div class="preview-name">
                <span>YOUR COMPANION</span>
                <h2 id="preview-name">人物一</h2>
            </div>

        </section>

    </main>
</div>
<a href="index.html" class="back-home-btn">返回首页</a>

<script src="js/c-api.js"></script>
<script src="js/companion-store.js"></script>
<script type="module" src="js/create.js"></script>

</body>
</html>
