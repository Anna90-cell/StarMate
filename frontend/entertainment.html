
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐空间 - StarMate</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pet.css">
</head>

<body>

    <header>
        <h1>娱乐空间</h1>
        <p>和你的伙伴自由互动吧！</p>
    </header>

    <main>

        <section>
            <div id="petContainer">

                <!-- 桌宠头顶消息气泡 -->
                <div id="petBubble" class="pet-bubble">
                    伙伴：今天想和我玩什么呢？
                </div>

                <div id="desktopPet">
                    <img
                        id="petImage"
                        src="assets/characters/states/idle/character-01.png"
                        alt="我的桌宠"
                    >
                </div>

                <p class="pet-tip">点击伙伴，和它互动！</p>

            </div>
        </section>

        <section>
            <h2>伙伴状态</h2>

            <button data-state="idle">待机</button>
            <button data-state="study">学习</button>
            <button data-state="happy">开心</button>
            <button data-state="rest">休息</button>
            <button data-state="sleep">睡觉</button>
        </section>

        <!-- 桌宠头顶的消息气泡
        <div id="petBubble" class="pet-bubble">
            伙伴：今天想和我玩什么呢？
        </div> -->

        <!-- 底部聊天输入框 -->
        <section id="chat-section">
            <div class="chat-bar">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="和伙伴说点什么吧..."
                >
                <button id="sendBtn">发送</button>
            </div>
        </section>
        <div class="page-actions">
            <a href="companion.html">返回伙伴主页</a>
            <a href="index.html">返回首页</a>
        </div>

    </main>

    <script src="js/c-api.js"></script>
    <script src="js/companion-store.js"></script>
    <script src="js/entertainment.js"></script>

</body>
</html>
